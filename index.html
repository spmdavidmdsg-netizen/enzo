<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enzo">
<meta name="description" content="Tu organización diaria: pendientes y rutina.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Enzo</title>
<script>
  /* Aplica el tema antes de pintar para evitar un destello. */
  (function(){try{var p=localStorage.getItem('enzo-tema')||'auto';var d=p==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):p;document.documentElement.dataset.theme=d;document.documentElement.dataset.vidrio=localStorage.getItem('enzo-vidrio')||'claro'}catch(e){}})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="welcome" role="dialog" aria-modal="true" aria-labelledby="w-hi">
  <h1 id="w-hi">Hola</h1>
  <p id="w-sub">Cargando tu día…</p>
  <button class="w-btn loading">Entrar</button>
</div>

<div id="app">
<header class="top">
  <button class="me glass" id="me" aria-label="Ajustes y tema" title="Ajustes" aria-expanded="false" aria-controls="menu"><span id="me-i">D</span><i id="sync" aria-hidden="true"></i></button>
  <div class="top-r">
    <button class="lupa glass" id="lupa" aria-label="Buscar pendientes" title="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg></button>
    <button class="fab glass" id="fab" aria-label="Nuevo pendiente" title="Nuevo pendiente (N)"><i></i></button>
    <div class="cap-wrap">
      <button class="cap glass" id="cap" aria-label="Cambiar de página"><span id="cap-label"></span></button>
      <div class="cap-list"><div class="pop glass tint" id="cap-pop"></div></div>
    </div>
  </div>
</header>

<main id="view"></main>
<nav class="rbar glass" id="rbar" aria-label="Secciones de rutina"></nav>
</div>

<div id="menu" class="glass tint" role="dialog" aria-label="Ajustes"></div>
<div id="scrim"></div>
<aside id="sheet" role="dialog" aria-modal="true" tabindex="-1"></aside>
<div id="toast" class="glass tint" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
